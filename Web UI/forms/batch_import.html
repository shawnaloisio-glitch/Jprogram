<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jprogram — Batch Import</title>
<style>
  :root {
    --bg: #ffffff; --fg: #222222; --muted: #666666;
    --card-bg: #f3f4f6; --hover-bg: #e5e7eb; --border: #cccccc;
    --accent: #2563eb; --accent-fg: #ffffff; --ok: #16a34a; --err: #dc2626;
    --input-bg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a1a1a; --fg: #e5e5e5; --muted: #999999;
      --card-bg: #2a2a2a; --hover-bg: #333333; --border: #444444;
      --accent: #3b82f6; --accent-fg: #ffffff; --ok: #4ade80; --err: #f87171;
      --input-bg: #262626;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1a1a1a; --fg: #e5e5e5; --muted: #999999;
    --card-bg: #2a2a2a; --hover-bg: #333333; --border: #444444;
    --accent: #3b82f6; --accent-fg: #ffffff; --ok: #4ade80; --err: #f87171;
    --input-bg: #262626;
  }
  body {
    font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px;
    background: var(--bg); color: var(--fg);
  }
  h1 { font-size: 1.3em; }
  label { display: block; margin-top: 16px; font-weight: 600; }
  .hint { font-weight: normal; color: var(--muted); font-size: 0.85em; }
  input[type=text], input[type=number], select {
    width: 100%; padding: 8px; margin-top: 4px; font-size: 1em;
    box-sizing: border-box; border: 1px solid var(--border); border-radius: 4px;
    background: var(--input-bg); color: var(--fg);
  }
  button {
    margin-top: 24px; padding: 10px 20px; font-size: 1em; cursor: pointer;
    background: var(--accent); color: var(--accent-fg); border: none; border-radius: 4px;
  }
  button:disabled { background: var(--muted); cursor: default; }
  #status { margin-top: 16px; font-weight: 600; }
  #status.ok { color: var(--ok); }
  #status.err { color: var(--err); }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }
  .back { display: inline-block; margin-bottom: 8px; color: var(--accent); text-decoration: none; font-size: 0.9em; }
  .back:hover { text-decoration: underline; }
  .path-row { display: flex; gap: 8px; margin-top: 4px; }
  .path-row input { margin-top: 0; }
  .path-row button {
    margin-top: 0; padding: 8px 14px; font-size: 0.9em; white-space: nowrap;
    background: var(--card-bg); color: var(--fg); border: 1px solid var(--border); border-radius: 4px; cursor: pointer;
  }
  .path-row button:hover { background: var(--hover-bg); }
  .theme-toggle {
    position: fixed; top: 16px; right: 16px; display: inline-block; width: auto; margin: 0;
    padding: 6px 10px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px;
    cursor: pointer; font-size: 0.85em; color: var(--fg);
  }
  .theme-toggle:hover { background: var(--hover-bg); }
</style>
</head>
<body>
<button class="theme-toggle" id="themeToggle" type="button"></button>
<a class="back" href="/">&larr; All forms</a>
<h1>Batch Import</h1>
<p class="hint">Fills in fields for <code>batch_importer.py</code>. Applies to every file in the folder.</p>

<form id="f">
  <label>Folder path
    <span class="hint">containing the normalized source files (non-recursive)</span>
    <div class="path-row">
      <input type="text" id="folder" required placeholder="D:\Sourced Content\...\some folder">
      <button type="button" id="browseBtn">Browse...</button>
    </div>
  </label>

  <label>Creator
    <select id="creator" required></select>
  </label>

  <div class="row">
    <div>
      <label>Style <span class="hint">(optional)</span>
        <select id="style"><option value="">— none —</option></select>
      </label>
    </div>
    <div>
      <label>Topic <span class="hint">(optional)</span>
        <select id="topic"><option value="">— none —</option></select>
      </label>
    </div>
  </div>

  <div class="row">
    <div>
      <label>Episode <span class="hint">(optional)</span>
        <input type="number" id="episode" min="0">
      </label>
    </div>
    <div>
      <label>Season <span class="hint">(optional)</span>
        <input type="number" id="season" min="0">
      </label>
    </div>
  </div>

  <label><input type="checkbox" id="dry_run" style="width:auto; display:inline; margin-right:6px;"> Dry run (preview only, nothing imported)</label>

  <button type="submit" id="submitBtn">Submit</button>
  <div id="status"></div>
</form>

<script>
async function loadConfig() {
  const res = await fetch('/api/config');
  const cfg = await res.json();
  const creatorSel = document.getElementById('creator');
  cfg.creators.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.creator_id;
    opt.textContent = c.display_name;
    creatorSel.appendChild(opt);
  });
  const styleSel = document.getElementById('style');
  cfg.styles.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s.style_id;
    opt.textContent = s.display_name;
    styleSel.appendChild(opt);
  });
  const topicSel = document.getElementById('topic');
  cfg.topics.forEach(t => {
    const opt = document.createElement('option');
    opt.value = t.topic_id;
    opt.textContent = t.display_name;
    topicSel.appendChild(opt);
  });
}
loadConfig().catch(err => {
  document.getElementById('status').textContent = 'Could not load config: ' + err.message;
  document.getElementById('status').className = 'err';
});

document.getElementById('browseBtn').addEventListener('click', async () => {
  const btn = document.getElementById('browseBtn');
  const status = document.getElementById('status');
  btn.disabled = true;
  const original = btn.textContent;
  btn.textContent = 'Waiting for dialog...';
  try {
    const res = await fetch('/api/browse-folder');
    const result = await res.json();
    if (result.path) {
      document.getElementById('folder').value = result.path;
    }
  } catch (err) {
    status.textContent = 'Could not open folder dialog: ' + err.message;
    status.className = 'err';
  } finally {
    btn.disabled = false;
    btn.textContent = original;
  }
});

document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const status = document.getElementById('status');
  btn.disabled = true;
  status.textContent = '';
  status.className = '';

  const payload = {
    form: 'batch_import',
    folder: document.getElementById('folder').value.trim(),
    creator: document.getElementById('creator').value,
    style: document.getElementById('style').value || null,
    topic: document.getElementById('topic').value || null,
    episode: document.getElementById('episode').value || null,
    season: document.getElementById('season').value || null,
    dry_run: document.getElementById('dry_run').checked,
  };

  try {
    const res = await fetch('/api/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const result = await res.json();
    if (result.ok) {
      status.textContent = 'Submitted. Claude will pick this up automatically.';
      status.className = 'ok';
    } else {
      status.textContent = 'Error: ' + (result.error || 'unknown');
      status.className = 'err';
    }
  } catch (err) {
    status.textContent = 'Error: ' + err.message;
    status.className = 'err';
  } finally {
    btn.disabled = false;
  }
});
</script>
<script src="/theme.js"></script>
</body>
</html>
