<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jprogram — Batch Import</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 1.3em; }
  label { display: block; margin-top: 16px; font-weight: 600; }
  .hint { font-weight: normal; color: #666; font-size: 0.85em; }
  input[type=text], input[type=number], select {
    width: 100%; padding: 8px; margin-top: 4px; font-size: 1em;
    box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;
  }
  button {
    margin-top: 24px; padding: 10px 20px; font-size: 1em; cursor: pointer;
    background: #2563eb; color: white; border: none; border-radius: 4px;
  }
  button:disabled { background: #999; cursor: default; }
  #status { margin-top: 16px; font-weight: 600; }
  #status.ok { color: #16a34a; }
  #status.err { color: #dc2626; }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }
  .back { display: inline-block; margin-bottom: 8px; color: #2563eb; text-decoration: none; font-size: 0.9em; }
  .back:hover { text-decoration: underline; }
</style>
</head>
<body>
<a class="back" href="/">&larr; All forms</a>
<h1>Batch Import</h1>
<p class="hint">Fills in fields for <code>batch_importer.py</code>. Applies to every file in the folder.</p>

<form id="f">
  <label>Folder path
    <span class="hint">containing the normalized source files (non-recursive)</span>
    <input type="text" id="folder" required placeholder="D:\Sourced Content\...\some folder">
  </label>

  <label>Creator
    <select id="creator" required></select>
  </label>

  <div class="row">
    <div>
      <label>Style <span class="hint">(optional)</span>
        <select id="style"><option value="">— none —</option></select>
      </label>
    </div>
    <div>
      <label>Topic <span class="hint">(optional)</span>
        <select id="topic"><option value="">— none —</option></select>
      </label>
    </div>
  </div>

  <div class="row">
    <div>
      <label>Episode <span class="hint">(optional)</span>
        <input type="number" id="episode" min="0">
      </label>
    </div>
    <div>
      <label>Season <span class="hint">(optional)</span>
        <input type="number" id="season" min="0">
      </label>
    </div>
  </div>

  <label><input type="checkbox" id="dry_run" style="width:auto; display:inline; margin-right:6px;"> Dry run (preview only, nothing imported)</label>

  <button type="submit" id="submitBtn">Submit</button>
  <div id="status"></div>
</form>

<script>
async function loadConfig() {
  const res = await fetch('/api/config');
  const cfg = await res.json();
  const creatorSel = document.getElementById('creator');
  cfg.creators.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.creator_id;
    opt.textContent = c.display_name;
    creatorSel.appendChild(opt);
  });
  const styleSel = document.getElementById('style');
  cfg.styles.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s.style_id;
    opt.textContent = s.display_name;
    styleSel.appendChild(opt);
  });
  const topicSel = document.getElementById('topic');
  cfg.topics.forEach(t => {
    const opt = document.createElement('option');
    opt.value = t.topic_id;
    opt.textContent = t.display_name;
    topicSel.appendChild(opt);
  });
}
loadConfig().catch(err => {
  document.getElementById('status').textContent = 'Could not load config: ' + err.message;
  document.getElementById('status').className = 'err';
});

document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const status = document.getElementById('status');
  btn.disabled = true;
  status.textContent = '';
  status.className = '';

  const payload = {
    form: 'batch_import',
    folder: document.getElementById('folder').value.trim(),
    creator: document.getElementById('creator').value,
    style: document.getElementById('style').value || null,
    topic: document.getElementById('topic').value || null,
    episode: document.getElementById('episode').value || null,
    season: document.getElementById('season').value || null,
    dry_run: document.getElementById('dry_run').checked,
  };

  try {
    const res = await fetch('/api/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const result = await res.json();
    if (result.ok) {
      status.textContent = 'Submitted. Claude will pick this up automatically.';
      status.className = 'ok';
    } else {
      status.textContent = 'Error: ' + (result.error || 'unknown');
      status.className = 'err';
      btn.disabled = false;
    }
  } catch (err) {
    status.textContent = 'Error: ' + err.message;
    status.className = 'err';
    btn.disabled = false;
  }
});
</script>
</body>
</html>
