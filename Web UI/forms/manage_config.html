<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jprogram — Manage Creators / Styles / Topics</title>
<style>
  :root {
    --bg: #ffffff; --fg: #222222; --muted: #666666;
    --card-bg: #f3f4f6; --hover-bg: #e5e7eb; --border: #cccccc;
    --accent: #2563eb; --accent-fg: #ffffff; --ok: #16a34a; --err: #dc2626;
    --input-bg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a1a1a; --fg: #e5e5e5; --muted: #999999;
      --card-bg: #2a2a2a; --hover-bg: #333333; --border: #444444;
      --accent: #3b82f6; --accent-fg: #ffffff; --ok: #4ade80; --err: #f87171;
      --input-bg: #262626;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1a1a1a; --fg: #e5e5e5; --muted: #999999;
    --card-bg: #2a2a2a; --hover-bg: #333333; --border: #444444;
    --accent: #3b82f6; --accent-fg: #ffffff; --ok: #4ade80; --err: #f87171;
    --input-bg: #262626;
  }
  body {
    font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px;
    background: var(--bg); color: var(--fg);
  }
  h1 { font-size: 1.3em; }
  label { display: block; margin-top: 16px; font-weight: 600; }
  .hint { font-weight: normal; color: var(--muted); font-size: 0.85em; }
  input[type=text], select {
    width: 100%; padding: 8px; margin-top: 4px; font-size: 1em;
    box-sizing: border-box; border: 1px solid var(--border); border-radius: 4px;
    background: var(--input-bg); color: var(--fg);
  }
  button {
    margin-top: 24px; padding: 10px 20px; font-size: 1em; cursor: pointer;
    background: var(--accent); color: var(--accent-fg); border: none; border-radius: 4px;
  }
  button:disabled { background: var(--muted); cursor: default; }
  #status { margin-top: 16px; font-weight: 600; }
  #status.ok { color: var(--ok); }
  #status.err { color: var(--err); }
  .back { display: inline-block; margin-bottom: 8px; color: var(--accent); text-decoration: none; font-size: 0.9em; }
  .back:hover { text-decoration: underline; }
  .theme-toggle {
    position: fixed; top: 16px; right: 16px; display: inline-block; width: auto; margin: 0;
    padding: 6px 10px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px;
    cursor: pointer; font-size: 0.85em; color: var(--fg);
  }
  .theme-toggle:hover { background: var(--hover-bg); }
  .existing {
    margin-top: 8px; padding: 10px 12px; background: var(--card-bg); border-radius: 6px;
    font-size: 0.85em; color: var(--muted); max-height: 140px; overflow-y: auto;
  }
  .existing div { padding: 2px 0; }
  .submitted-list { margin-top: 24px; }
  .submitted-list h2 { font-size: 0.95em; color: var(--muted); font-weight: 600; }
  .submitted-list ul { margin: 4px 0 0; padding-left: 20px; font-size: 0.9em; }
</style>
</head>
<body>
<button class="theme-toggle" id="themeToggle" type="button"></button>
<a class="back" href="/">&larr; All forms</a>
<h1>Manage Creators / Styles / Topics</h1>
<p class="hint">Add a new creator, style, or topic. Claude picks these up and applies them — this form doesn't write the config files directly, so entries won't be usable in the Batch Import form until that happens.</p>

<form id="f">
  <label>Adding a
    <select id="type">
      <option value="creator">Creator</option>
      <option value="style">Style</option>
      <option value="topic">Topic</option>
    </select>
  </label>

  <div id="creatorFields">
    <label>Creator ID
      <span class="hint">short slug, e.g. <code>nihongo_jikan</code> — lowercase, hyphens/underscores only</span>
      <input type="text" id="creator_id" pattern="[a-z0-9_-]+">
    </label>
  </div>

  <label>Display name
    <span class="hint">what shows up in the dropdown</span>
    <input type="text" id="display_name" required>
  </label>

  <div class="existing" id="existingList">Loading current entries…</div>

  <button type="submit" id="submitBtn">Submit</button>
  <div id="status"></div>

  <div class="submitted-list" id="submittedWrap" style="display:none">
    <h2>Submitted this session</h2>
    <ul id="submittedItems"></ul>
  </div>
</form>

<script>
let cfg = { creators: [], styles: [], topics: [] };

function renderExisting() {
  const type = document.getElementById('type').value;
  const box = document.getElementById('existingList');
  const list = cfg[type + 's'] || [];
  if (!list.length) {
    box.textContent = 'No ' + type + 's defined yet.';
    return;
  }
  box.innerHTML = '';
  list.forEach(item => {
    const div = document.createElement('div');
    const idKey = type + '_id';
    div.textContent = item.display_name + (item[idKey] !== undefined ? '  (' + item[idKey] + ')' : '');
    box.appendChild(div);
  });
}

async function loadConfig() {
  const res = await fetch('/api/config');
  cfg = await res.json();
  renderExisting();
}
loadConfig().catch(err => {
  document.getElementById('existingList').textContent = 'Could not load current entries: ' + err.message;
});

document.getElementById('type').addEventListener('change', () => {
  const type = document.getElementById('type').value;
  document.getElementById('creatorFields').style.display = (type === 'creator') ? '' : 'none';
  document.getElementById('creator_id').required = (type === 'creator');
  renderExisting();
});

const submitted = [];
function renderSubmitted() {
  const wrap = document.getElementById('submittedWrap');
  const ul = document.getElementById('submittedItems');
  if (!submitted.length) { wrap.style.display = 'none'; return; }
  wrap.style.display = '';
  ul.innerHTML = '';
  submitted.forEach(s => {
    const li = document.createElement('li');
    li.textContent = s;
    ul.appendChild(li);
  });
}

document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const status = document.getElementById('status');
  const type = document.getElementById('type').value;
  const displayName = document.getElementById('display_name').value.trim();
  const creatorId = document.getElementById('creator_id').value.trim();

  if (type === 'creator' && !creatorId) {
    status.textContent = 'Creator ID is required.';
    status.className = 'err';
    return;
  }

  btn.disabled = true;
  status.textContent = '';
  status.className = '';

  const payload = {
    form: 'manage_config',
    type: type,
    display_name: displayName,
  };
  if (type === 'creator') payload.creator_id = creatorId;

  try {
    const res = await fetch('/api/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const result = await res.json();
    if (result.ok) {
      status.textContent = 'Submitted. Claude will pick this up automatically.';
      status.className = 'ok';
      submitted.push(type + ': ' + displayName + (type === 'creator' ? ' (' + creatorId + ')' : ''));
      renderSubmitted();
      document.getElementById('display_name').value = '';
      document.getElementById('creator_id').value = '';
    } else {
      status.textContent = 'Error: ' + (result.error || 'unknown');
      status.className = 'err';
    }
  } catch (err) {
    status.textContent = 'Error: ' + err.message;
    status.className = 'err';
  } finally {
    btn.disabled = false;
  }
});
</script>
<script src="/theme.js"></script>
</body>
</html>
